name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifests
        run: bash scripts/validate-manifests.sh

      - name: Privacy scan (generic detectors — no real IDs/paths/keys in the public repo)
        run: node scripts/privacy-scan
